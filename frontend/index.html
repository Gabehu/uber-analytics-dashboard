<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d24" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Inline SVG favicon: a small bar-chart mark in the app's blue accent
         on the charcoal background, so the browser tab matches the dashboard
         instead of showing Vite's default lightning bolt. No extra file to
         manage -- the icon is embedded directly. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon-192.svg"
    />

    <meta
      name="description"
      content="Uber Nest Tracker — a personal dashboard for tracking Uber delivery earnings, mileage, time, and daily efficiency."
    />

    <title>Uber Nest Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
